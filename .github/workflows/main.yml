name: Build DS3 v2 experimental ESP32-S2

on:
  push:
    branches: [main, master]
    paths:
      - 'usb-s2-ds3-v2/**'
      - 'shared/pad_packet.h'
      - '.github/workflows/ds3-v2.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ds3-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install 'platformio==6.1.19'
      - name: Build firmware
        run: python -m platformio run -d usb-s2-ds3-v2 -e lolin_s2_ds3_v2
      - name: Upload complete flash images
        uses: actions/upload-artifact@v5
        with:
          name: lolin-s2-ds3-v2-experimental
          path: |
            usb-s2-ds3-v2/.pio/build/lolin_s2_ds3_v2/firmware.bin
            usb-s2-ds3-v2/.pio/build/lolin_s2_ds3_v2/bootloader.bin
            usb-s2-ds3-v2/.pio/build/lolin_s2_ds3_v2/partitions.bin
          if-no-files-found: error
